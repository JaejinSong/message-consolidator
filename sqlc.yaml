version: "2"
sql:
  - schema: "store/queries/schema.sql"
    queries: "store/queries/"
    engine: "sqlite"
    gen:
      go:
        package: "db"
        out: "db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        overrides:
          - column: "v_messages.deadline_date"
            go_type: "database/sql.NullTime"
            nullable: true

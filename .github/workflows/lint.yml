name: lint

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "src/**"
      - "static/css/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".stylelintrc.json"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "src/**"
      - "static/css/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".stylelintrc.json"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
  frontend:
    name: eslint + stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
